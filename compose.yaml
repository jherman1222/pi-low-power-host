# Foundation stack: Mosquitto + Home Assistant Container
# Bring-up: ./scripts/init-mqtt.sh && docker compose -f compose.yaml up -d
name: pi-low-power

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ${DATA_ROOT:-/srv/pi-data}/mosquitto/config:/mosquitto/config:ro
      - ${DATA_ROOT:-/srv/pi-data}/mosquitto/data:/mosquitto/data
      - ${DATA_ROOT:-/srv/pi-data}/mosquitto/log:/mosquitto/log
    environment:
      MQTT_USER: ${MQTT_USER:-pi}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_USER\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ${DATA_ROOT:-/srv/pi-data}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    depends_on:
      mosquitto:
        condition: service_healthy
